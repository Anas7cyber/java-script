<!DOCTYPE html>
<html>
    <body>
        <p>a function can acess varibles defined inside the function:</p>
        <button type="button" onclick="myfunction()">button: CLICK ME TO SAVE ME</button>
        <p id="demo"></p>
        <p id="demo1"></p>
        <p id="demo2"></p>
        <script>
            var b = 5;
            function myfunction(){
                var a = 4;
                document.getElementById("demo").innerHTML = b * a;
                document.getElementById("demo1").innerHTML = a;
            document.getElementById("demo2").innerHTML = b;
            }
        </script>
    </body>
</html>
